# =============================================================================
# Build and Push Docker Images to GHCR
# =============================================================================
# Builds all 3 Docker images (flutter-android, native-android, web-builder)
# in parallel using a matrix strategy and pushes them to GitHub Container
# Registry (ghcr.io).
# =============================================================================

name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image:
        description: 'Specific image to build (leave empty for all)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - flutter-android
          - native-android
          - web-builder

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/raj998302-art/universal-ai-builder

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - flutter-android
          - native-android
          - web-builder
        exclude:
          - image: ${{ github.event.inputs.image != '' && github.event.inputs.image != 'flutter-android' && 'flutter-android' || 'NONE' }}
          - image: ${{ github.event.inputs.image != '' && github.event.inputs.image != 'native-android' && 'native-android' || 'NONE' }}
          - image: ${{ github.event.inputs.image != '' && github.event.inputs.image != 'web-builder' && 'web-builder' || 'NONE' }}

    steps:
      # -------------------------------------------------------------------
      # Checkout repository
      # -------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # Set up Docker Buildx for multi-platform support
      # -------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.13.2

      # -------------------------------------------------------------------
      # Login to GitHub Container Registry
      # -------------------------------------------------------------------
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------------
      # Extract metadata (tags, labels) for Docker
      # -------------------------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            # Set latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Git short SHA
            type=sha,prefix=sha-,format=short
            # Semantic version from git tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Branch name
            type=ref,event=branch
            # PR number
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=Build environment for universal-ai-builder (${{ matrix.image }})

      # -------------------------------------------------------------------
      # Build and push Docker image
      # -------------------------------------------------------------------
      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ./docker/${{ matrix.image }}
          file: ./docker/${{ matrix.image }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

      # -------------------------------------------------------------------
      # Output image digest
      # -------------------------------------------------------------------
      - name: Image digest
        run: echo "Image digest for ${{ matrix.image }}:${{ steps.meta.outputs.version }}"
